<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Markdown Preview</h1>
        
        <!-- Markdown Input -->
        <textarea id="markdown-input" class="w-full h-40 p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Enter Markdown here..."></textarea>
        
        <button onclick="renderMarkdown()" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
            Render Markdown
        </button>

        <!-- Rendered Markdown Output -->
        <div id="markdown-output" class="mt-6 p-4 border rounded-md bg-gray-50"></div>
    </div>

    <script>
        function renderMarkdown() {
            const input = document.getElementById("markdown-input").value;
            document.getElementById("markdown-output").innerHTML = marked.parse(input);
        }
    </script>
</body>
</html>
